[project]
name = "pipe-ping"
dynamic = ["version"]
description = "Async CI/CD pipeline monitor with cross-platform toast notifications"
authors = [{ name = "Edward Emmett", email = "edemms12@gmail.com" }]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.11",
    "apscheduler>=3.10",
    "fastapi>=0.115",
    "pymongo>=4.10",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "typer>=0.15",
    "uvicorn>=0.34",
    "desktop-notifier>=6.0",
]

[project.scripts]
pipe-ping = "pipe_ping.cli:app"

[project.entry-points."pipe_ping.providers"]
github = "pipe_ping.providers.github:GitHubProvider"
gitlab = "pipe_ping.providers.gitlab:GitLabProvider"

[project.entry-points."pipe_ping.notifiers"]
desktop = "pipe_ping.notifiers.desktop:DesktopNotifier"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "pipe_ping/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pipe_ping"]

[dependency-groups]
dev = [
    "aioresponses>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "ty>=0.0.1a14",
    "prek>=0.1",
]
