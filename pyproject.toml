[project]
name = "pipe-ping"
dynamic = ["version"]
description = "Async CI/CD pipeline monitor with cross-platform toast notifications"
authors = [{ name = "Edward Emmett", email = "edemms12@gmail.com" }]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "aiosqlite>=0.22",
    "desktop-notifier>=6.2",
    "platformdirs>=4.10.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-json-logger>=4.1.0",
    "rich>=15.0.0",
    "typer>=0.15",
]

[project.scripts]
pipe-ping = "pipe_ping.client:app"

[project.entry-points."pipe-ping.providers"]
GitHubProvider = "pipe_ping.plugin._impl.github:GitHubProvider"

[project.entry-points."pipe-ping.repository"]
SqliteRepository = "pipe_ping.plugin._impl.sqlite:SqliteRepository"

[project.entry-points."pipe-ping.notifiers"]
ConsoleNotifier = "pipe_ping.plugin._impl.console:ConsoleNotifier"
DesktopNotifier = "pipe_ping.plugin._impl.desktop:DesktopNotifier"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "pipe_ping/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pipe_ping"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "ty>=0.0.1a14",
    "prek>=0.1",
    "dbus-fast>=5.2",
    "nox>=2026.8",
]
