on:
  pull_request:
    types: [opened]

jobs:
  link:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Link issue from branch name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref }}
        run: |
          ISSUE=$(echo "$BRANCH" | grep -oP '(?<=\/)\d+')
          if [ -n "$ISSUE" ]; then
            BODY=$(gh pr view $PR_NUMBER --repo ${{ github.repository }} --json body -q .body)
            gh pr edit $PR_NUMBER --repo ${{ github.repository }} --body "${BODY/Closes #/Closes #$ISSUE}"
          fi
