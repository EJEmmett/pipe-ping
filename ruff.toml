src = ["pipe_ping"]
line-length = 88
target-version = "py313"

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async — no blocking calls in async context
    "ANN",   # flake8-annotations — type hints on every signature
    "C4",    # flake8-comprehensions
    "G",     # flake8-logging-format
    "LOG",   # flake8-logging
    "N",     # pep8-naming
    "PERF",  # perflint
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "RET",   # flake8-return
    "RUF",   # ruff-specific rules
    "S",     # flake8-bandit (security)
    "TC",    # flake8-type-checking — TYPE_CHECKING import blocks
    "TRY",   # tryceratops — exception handling patterns
]
ignore = [
    "ANN401", # Any is occasionally necessary
    "TRY003", # long exception messages are fine
    "S311",   # random is fine for non-cryptographic use
]

[lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]
