# logging.config.dictConfig schema. Values that depend on settings or CLI flags
# (console level, log file path and rotation) are filled in by logging_config().

version = 1
disable_existing_loggers = false

[formatters.plain]
format = "%(asctime)s %(levelname)s %(name)s %(message)s"

[formatters.json]
"()" = "pythonjsonlogger.json.JsonFormatter"
fmt = "%(timestamp)s %(levelname)s %(name)s %(message)s"
rename_fields = { name = "logger", levelname = "level" }
timestamp = true

[handlers.console]
class = "logging.StreamHandler"
formatter = "plain"
stream = "ext://sys.stdout"

[handlers.structured]
class = "logging.handlers.RotatingFileHandler"
formatter = "json"
level = "DEBUG"

[handlers.queue]
class = "logging.handlers.QueueHandler"
listener = "pipe_ping.tools.logging.AutoStartQueueListener"
handlers = ["console", "structured"]
respect_handler_level = true

[root]
level = "DEBUG"
handlers = ["queue"]

# Logs every SQL statement with its parameters at DEBUG.
[loggers.aiosqlite]
level = "INFO"
