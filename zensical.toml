[project]
site_name = "Pipe-Ping"
site_url = "https://ejemmett.github.io/pipe-ping/"
site_description = "A pluggable CI/CD monitor that notifies you when pipelines succeed, fail or are cancelled"
site_author = "Edward Emmett"
copyright = "Copyright &copy; 2026 Edward Emmett"
repo_url = "https://github.com/EJEmmett/pipe-ping"
repo_name = "EJEmmett/pipe-ping"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Configuration" = "configuration.md" },
  { "Notifications" = "notifications.md" },
  { "Running in the background" = "running-in-the-background.md" },
  { "Plugins" = [
    { "Writing a plugin" = "plugins/index.md" },
    { "How plugins run" = "plugins/runtime.md" },
  ] },
  { "Reference" = [
    { "Command line" = "reference/cli.md" },
    { "API" = "reference/api.md" },
  ] },
  { "Development" = "development.md" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/EJEmmett/pipe-ping"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
heading_level = 3
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_root_heading = true
show_root_full_path = false
show_signature_annotations = true
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
